apiVersion: apps/v1
kind: Deployment
metadata:
  name: one-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: one-api-backend
  template:
    metadata:
      labels:
        app: one-api-backend
    spec:
      containers:
        - name: one-api-backend
          image: "{{.Values.image.oneApiBackend.repository}}:{{.Values.image.oneApiBackend.tag}}"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: 3000